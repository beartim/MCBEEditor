name: Build iOS 13

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize script permissions
        run: chmod +x Scripts/*.sh


      - name: Verify Xcode 16.4
        run: |
          [[ -d "$DEVELOPER_DIR" ]] || {
            printf 'Xcode 16.4 is missing at %s.\n' "$DEVELOPER_DIR" >&2
            exit 1
          }
          XCODE_VERSION_OUTPUT="$(xcodebuild -version 2>&1)" || {
            printf 'Unable to read the selected Xcode version:\n%s\n' "$XCODE_VERSION_OUTPUT" >&2
            exit 1
          }
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          XCODE_VERSION="$(awk '/^Xcode / { version = $2 } END { print version }' <<< "$XCODE_VERSION_OUTPUT")"
          [[ "$XCODE_VERSION" == 16.4 || "$XCODE_VERSION" == 16.4.* ]] || {
            printf 'Expected Xcode 16.4, found %s.\n' "${XCODE_VERSION:-unknown}" >&2
            exit 1
          }

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate iOS 13 project
        run: bash Scripts/bootstrap.sh

      - name: Run portable core tests
        run: bash Scripts/run_core_tests.sh

      - name: Build simulator target
        run: |
          xcodebuild \
            -project MCBEEditor.xcodeproj \
            -scheme MCBEEditor \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iOS 13 IPA
        run: bash Scripts/build_unsigned_ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: MCBEEditor-iOS13-unsigned
          path: build/output/MCBEEditor-iOS13-unsigned.ipa
          if-no-files-found: error
