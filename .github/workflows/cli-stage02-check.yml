name: CLI stage 02 Windows world checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-world:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build native LevelDB, CLI and run the stage regressions
        shell: pwsh
        run: ./CLI/Scripts/build-windows.ps1 -Test
